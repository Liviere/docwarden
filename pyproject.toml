[tool.poetry]
name = "docwarden"
version = "0.1.0"
description = "Configurable Markdown prose-density and docs-vs-code drift linting."
authors = ["Tomasz Osiński"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Liviere/docwarden"
packages = [{ include = "docwarden", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
markdown-it-py = "^4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.7"

[tool.poetry.scripts]
docwarden = "docwarden.cli:main"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
